<!doctype html>
<html lang="vi">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Mưa trái tim</title>
	<link rel="stylesheet" href="style.css">
	</head>
<body>
	<div class="scene">
        <div id="hearts" aria-hidden="true"></div>
        
		<div style="display:flex;flex-direction:column;align-items:center;gap:1rem;background:rgba(255,255,255,0.06);backdrop-filter:blur(10px);padding:10px 12px;border-radius:10px;color:#fff;">
			<h1>gấi iu tui ăng món gi héeee</h1>
			<input id="message" placeholder="ghi món dô đây nề <3">
			<button id="sendBtn" style="position:relative;width:100%;padding:6px 10px;border-radius:6px;border:0;background:#ff6b9a;color:#111;font-weight:600">Ăng nhăng nhăng nhăng</button>
		</div>
		
        <div class="controls" style="display: none;">
            <label>Density: <input id="density" type="range" min="1" max="50" value="1"></label>
			<button id="toggle">Pause</button>
		</div>
	</div>
    
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/supabase.min.js"></script>
	<script src="script.js"></script>
</body>
</html>
